[project]
name = "cargo-extract"
version = "0.1.0"
description = "Ekstraksi data pesanan dari chat pelanggan cargo (Indonesia/Mandarin/Inggris) dengan LLM lokal"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
